<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e293b">
<title>שבילי ישראל</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100dvh; overflow:hidden; font-family:'Segoe UI','Arial Hebrew',Arial,sans-serif; background:#0f172a; }
#app { display:flex; flex-direction:column; height:100dvh; }

/* Topbar */
#topbar {
  display:flex; align-items:center; gap:6px;
  padding:0 10px; height:52px; padding-top:env(safe-area-inset-top);
  background:#1e293b; border-bottom:1px solid #334155; flex-shrink:0; z-index:2000;
}
.logo { font-size:15px; font-weight:800; color:#f8fafc; display:flex; align-items:center; gap:5px; white-space:nowrap; }
.logo em { color:#34d399; font-style:normal; }

/* Search bar */
#search-wrap {
  flex:1; display:flex; align-items:center; gap:0;
  background:#0f172a; border:1px solid #334155; border-radius:8px;
  overflow:hidden; max-width:340px;
}
#search-input {
  flex:1; background:transparent; border:none; outline:none;
  color:#e2e8f0; font-size:13px; padding:7px 10px;
  font-family:inherit; direction:rtl;
}
#search-input::placeholder { color:#475569; }
#search-btn {
  padding:7px 10px; background:transparent; border:none;
  color:#64748b; cursor:pointer; display:flex; align-items:center;
}
#search-btn:active { color:#94a3b8; }

#search-results {
  position:absolute; top:52px; right:0; left:0; z-index:3000;
  background:#1e293b; border-bottom:1px solid #334155;
  max-height:220px; overflow-y:auto; display:none;
}
.sr-item {
  padding:10px 14px; border-bottom:1px solid #1a2540; cursor:pointer;
  font-size:13px; color:#cbd5e1; display:flex; align-items:center; gap:8px;
}
.sr-item:hover, .sr-item:active { background:#334155; }
.sr-icon { color:#64748b; flex-shrink:0; }
.sr-name { font-weight:500; }
.sr-sub { font-size:11px; color:#64748b; margin-top:1px; }

.topbtn {
  display:flex; align-items:center; gap:4px; padding:6px 9px;
  border-radius:8px; border:1px solid #334155; background:transparent;
  color:#94a3b8; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit;
  white-space:nowrap;
}
.topbtn:active { background:#334155; }

/* Map */
#map-container { flex:1; position:relative; overflow:hidden; margin-bottom:68px; }
#map { width:100%; height:100%; }

/* Bottom bar */
#bottom-bar {
  position:absolute; bottom:0; left:0; right:0; z-index:2000;
  background:#1e293b; border-top:1px solid #334155;
  display:flex; align-items:center; justify-content:space-around;
  padding:8px 6px; padding-bottom:calc(8px + env(safe-area-inset-bottom));
  height:68px;
}
.bbt {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 10px; border-radius:10px; border:1px solid #334155;
  background:transparent; color:#94a3b8; font-size:10px; font-weight:600;
  cursor:pointer; min-width:52px; font-family:inherit;
  transition:background 0.1s, border-color 0.1s;
}
.bbt:active { transform:scale(0.93); }
.bbt.pan-active  { background:#1e3a8a; border-color:#3b82f6; color:#bfdbfe; }
.bbt.free-active { background:#1e3a8a; border-color:#60a5fa; color:#dbeafe; }
.bbt.snap-active { background:#14532d; border-color:#4ade80; color:#bbf7d0; }

/* Floating panels */
.fp {
  position:absolute; z-index:1000;
  background:rgba(15,23,42,0.93); border:1px solid #334155;
  border-radius:12px; backdrop-filter:blur(10px);
}

#layer-panel { top:10px; left:10px; padding:10px; min-width:140px; }
.pt { font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase;
  letter-spacing:.1em; margin-bottom:8px; }
.lr { display:flex; align-items:center; gap:8px; padding:5px 3px; border-radius:6px; cursor:pointer; }
.lr:active { background:rgba(255,255,255,0.07); }
.lr input { accent-color:#34d399; width:15px; height:15px; cursor:pointer; flex-shrink:0; }
.lr label { font-size:12px; color:#cbd5e1; cursor:pointer; user-select:none; }

#snap-panel { top:10px; right:10px; padding:10px 13px; font-size:12px; color:#94a3b8; max-width:190px; display:none; }
#snap-panel.on { display:block; }
#snap-ttl { font-weight:700; color:#e2e8f0; margin-bottom:3px; font-size:13px; }

#route-panel { bottom:10px; right:10px; padding:12px 16px; display:none; min-width:130px; }
.rl { font-size:11px; color:#64748b; }
.rv { font-size:26px; font-weight:800; color:#f8fafc; line-height:1.1; }
.rp { font-size:11px; color:#64748b; margin-top:2px; }

/* GPS */
#gps-btn {
  position:absolute; bottom:10px; left:10px; z-index:1000;
  width:42px; height:42px; border-radius:50%;
  background:rgba(15,23,42,0.93); border:1px solid #334155;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:#94a3b8;
}
#gps-btn.on { color:#34d399; border-color:#34d399; }
#gps-btn:active { transform:scale(0.91); }

/* Status */
#statusbar {
  position:absolute; bottom:10px; left:58px; right:10px; z-index:1000;
  background:rgba(15,23,42,0.88); border:1px solid #334155; border-radius:999px;
  padding:5px 14px; font-size:12px; color:#94a3b8;
  pointer-events:none; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* Install banner */
#install-banner {
  display:none; align-items:center; gap:8px; padding:8px 12px;
  background:#134e4a; border-bottom:1px solid #0d9488;
  font-size:13px; color:#ccfbf1; z-index:3000; flex-shrink:0;
}
#install-banner button {
  padding:4px 12px; border-radius:6px; background:#0d9488; border:none;
  color:#fff; font-weight:600; cursor:pointer; font-family:inherit; font-size:12px;
}
.xbtn { background:transparent!important; border:1px solid #0d9488!important; color:#99f6e4!important; margin-right:auto; }

/* Hover line preview (snap) */
.preview-line { stroke-dasharray:6,4; }

/* Leaflet dark */
.leaflet-control-zoom a { background:rgba(15,23,42,0.93)!important; color:#e2e8f0!important; border-color:#334155!important; width:36px!important; height:36px!important; line-height:36px!important; font-size:18px!important; }
.leaflet-control-zoom { border:none!important; margin-bottom:8px!important; }
.leaflet-control-attribution { background:rgba(15,23,42,0.7)!important; color:#475569!important; font-size:10px; }

/* Search pin marker */
.search-pin { width:28px; height:28px; }
</style>
</head>
<body>
<div id="app">

  <div id="install-banner">
    <span>📲 התקן כאפליקציה</span>
    <button id="ibtn">התקן</button>
    <button class="xbtn" onclick="document.getElementById('install-banner').style.display='none'">✕</button>
  </div>

  <div id="topbar">
    <div class="logo">🥾 <em>שבילי</em></div>
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="חפש מקום..." autocomplete="off" autocorrect="off" spellcheck="false"/>
      <button id="search-btn" onclick="doSearch()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
    </div>
    <button class="topbtn" onclick="exportGPX()">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v9M4 7l4 4 4-4M2 13h12"/></svg>
      GPX
    </button>
  </div>

  <!-- Search results dropdown -->
  <div id="search-results"></div>

  <div id="map-container">
    <div id="map"></div>

    <!-- Layer panel — only IHM + satellite -->
    <div class="fp" id="layer-panel">
      <div class="pt">שכבות</div>
      <div class="lr" onclick="toggleLayer('ihm')"><input type="checkbox" id="c-ihm" checked><label for="c-ihm">🥾 Israel Hiking</label></div>
      <div class="lr" onclick="toggleLayer('sat')"><input type="checkbox" id="c-sat"><label for="c-sat">🛰 לוויין</label></div>
      <div style="height:1px;background:#1e293b;margin:6px 0"></div>
      <div class="pt" style="margin-bottom:5px">מסלול</div>
      <div style="display:flex;align-items:center;gap:6px;padding:2px 3px;font-size:11px;color:#94a3b8">
        <div style="width:22px;height:4px;background:#4ade80;border-radius:2px;flex-shrink:0"></div>על שביל
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding:2px 3px;font-size:11px;color:#94a3b8">
        <div style="width:22px;height:4px;background:repeating-linear-gradient(90deg,#fb923c 0 6px,transparent 6px 10px);flex-shrink:0"></div>הלוך-חזור
      </div>
    </div>

    <div class="fp" id="snap-panel">
      <div id="snap-ttl">Snap to Trail</div>
      <div id="snap-msg">גע ליד שביל</div>
    </div>

    <div id="gps-btn" onclick="toggleGPS()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      </svg>
    </div>

    <div class="fp" id="route-panel">
      <div class="rl">אורך מסלול</div>
      <div class="rv" id="rdist">0.0</div>
      <div class="rp" id="rpts">ק"מ</div>
    </div>

    <div id="statusbar">בחר מצב ציור</div>
  </div>

  <div id="bottom-bar">
    <button class="bbt pan-active" id="btn-pan" onclick="setMode('pan')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/></svg>
      תצוגה
    </button>
    <button class="bbt" id="btn-free" onclick="setMode('free')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20L7 7l5 5 7-10"/></svg>
      חופשי
    </button>
    <button class="bbt" id="btn-snap" onclick="setMode('snap')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20c3-6 5-9 9-9s6 4 9-6"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
      Snap
    </button>
    <button class="bbt" onclick="undoLast()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12H14a5 5 0 0 1 0 10H9"/><path d="M4 12L8 8M4 12l4 4"/></svg>
      בטל
    </button>
    <button class="bbt" onclick="clearRoute()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
      נקה
    </button>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ── PWA install ──────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('install-banner').style.display = 'flex';
});
document.getElementById('ibtn').onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').style.display = 'none';
};

// ── Overpass fetch ───────────────────────────────────────
const SERVERS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.osm.ch/api/interpreter',
  'https://lz4.overpass-api.de/api/interpreter',
];

// ── Geo-tile cache ───────────────────────────────────────
// חותך את ישראל לריבועים של ~5×5 ק"מ (0.05 מעלות).
// כל ריבוע נשלח פעם אחת בלבד — כל שאר הלחיצות באותו אזור מיידיות.
const TILE_SIZE = 0.05; // ~5.5 ק"מ
const geoCache = new Map(); // key:"lat_lng" → Promise<Element[]>
const pendingTiles = new Map(); // מניעת בקשות כפולות לאותו tile

function tileKey(lat, lng) {
  const tLat = Math.floor(lat / TILE_SIZE);
  const tLng = Math.floor(lng / TILE_SIZE);
  return `${tLat}_${tLng}`;
}

function tileBounds(lat, lng) {
  const tLat = Math.floor(lat / TILE_SIZE) * TILE_SIZE;
  const tLng = Math.floor(lng / TILE_SIZE) * TILE_SIZE;
  // מוסיפים חפיפה של 20% למניעת חיתוכים בקצוות
  const pad = TILE_SIZE * 0.2;
  return {
    s: tLat - pad, n: tLat + TILE_SIZE + pad,
    w: tLng - pad, e: tLng + TILE_SIZE + pad
  };
}

async function fetchTile(lat, lng) {
  const key = tileKey(lat, lng);
  if (geoCache.has(key)) return geoCache.get(key);
  if (pendingTiles.has(key)) return pendingTiles.get(key); // אותה בקשה בתהליך

  const {s,n,w,e} = tileBounds(lat, lng);
  const q = `[out:json][timeout:20];
(
  way["highway"~"^(path|footway|track|steps|pedestrian|bridleway)$"](${s},${w},${n},${e});
  way["trail_visibility"](${s},${w},${n},${e});
  way["sac_scale"](${s},${w},${n},${e});
  way["color"~"red|blue|green|black"](${s},${w},${n},${e});
);
out geom qt;`;

  const promise = (async () => {
    const opts = {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'data='+encodeURIComponent(q), credentials:'omit'};
    let lastErr;
    for (const s of SERVERS) {
      try { const r=await fetch(s,opts); if(r.ok){ const d=await r.json(); return d.elements||[]; } }
      catch(e) { lastErr=e; }
    }
    throw lastErr || new Error('כל שרתי Overpass נכשלו');
  })();

  pendingTiles.set(key, promise);
  try {
    const elements = await promise;
    geoCache.set(key, elements); // שמור בcache
    setSnapMsg(`💾 ${geoCache.size} אזורים בcache`);
    return elements;
  } finally {
    pendingTiles.delete(key);
  }
}

// מחזיר כל הelements הרלוונטיים לנקודה — ממולטיפל tiles אם צריך
async function getTrailsNear(ll) {
  // טוען גם את ה-tile הסמוך אם הנקודה קרובה לגבול
  const keys = new Set();
  for (const dLat of [0, TILE_SIZE*0.1, -TILE_SIZE*0.1]) {
    for (const dLng of [0, TILE_SIZE*0.1, -TILE_SIZE*0.1]) {
      keys.add(tileKey(ll.lat+dLat, ll.lng+dLng));
    }
  }
  const allEls = [];
  for (const key of keys) {
    const [tLat, tLng] = key.split('_').map(Number);
    const els = await fetchTile(tLat*TILE_SIZE + TILE_SIZE/2, tLng*TILE_SIZE + TILE_SIZE/2);
    allEls.push(...els);
  }
  // הסר כפולות לפי id
  const seen = new Set();
  return allEls.filter(el => { if(seen.has(el.id)) return false; seen.add(el.id); return true; });
}

// פונקציה ישנה נשמרת לתאימות אחורה
async function ovFetch(q) {
  const opts = {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'data='+encodeURIComponent(q), credentials:'omit'};
  let lastErr;
  for (const s of SERVERS) {
    try { const r = await fetch(s,opts); if(r.ok) return await r.json(); }
    catch(e) { lastErr=e; }
  }
  throw lastErr || new Error('כל שרתי Overpass נכשלו');
}

// ── State ────────────────────────────────────────────────
let map, mode='pan';
// snapPts = נקודות "עוגן" שהמשתמש בחר (waypoints)
// snapSegs = מערך של קטעים, כל קטע = מערך nקודות OSM
// יחד הם יוצרים את המסלול הסופי
let snapPts=[], snapSegs=[], freePolyline=null, snapPolylines=[];
let undoStack=[];
let ihmL, satL;
let gpsMarker=null, gpsCircle=null, gpsOn=false, watchId=null;
let searchMarker=null;
let previewLine=null; // קו תצוגה מקדימה בזמן ריחוף

// ── Tile layer with auto-retry ────────────────────────────
// מרחיב את TileLayer עם retry אוטומטי עד 3 פעמים לכל טייל
L.TileLayerRetry = L.TileLayer.extend({
  options: { maxRetries: 3, retryDelay: 800 },
  createTile(coords, done) {
    const tile = document.createElement('img');
    tile.setAttribute('role', 'presentation');
    const url = this.getTileUrl(coords);
    let attempts = 0;
    const tryLoad = () => {
      tile.onload  = () => done(null, tile);
      tile.onerror = () => {
        attempts++;
        if (attempts < this.options.maxRetries) {
          setTimeout(() => { tile.src = ''; tile.src = url + '?r=' + attempts; tryLoad(); },
            this.options.retryDelay * attempts);
        } else {
          // אחרי כל הנסיונות — השאר שקוף (לא ריבוע לבן)
          tile.style.opacity = '0';
          done(null, tile);
        }
      };
      tile.crossOrigin = '';
      tile.src = url;
    };
    tryLoad();
    return tile;
  }
});
L.tileLayerRetry = (url, opts) => new L.TileLayerRetry(url, opts);

// ── Init ─────────────────────────────────────────────────
function initMap() {
  map = L.map('map', {center:[31.5,35.0], zoom:8, zoomControl:true, tap:true, tapTolerance:25});

  // שכבת רקע קלה מ-OSM — תמיד נטענת, מונעת ריבועים לבנים
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap', maxZoom:19, subdomains:'abc', opacity:0.15
  }).addTo(map);

  // Israel Hiking Map עם retry אוטומטי
  // maxNativeZoom:16 = בזום גבוה יותר Leaflet עושה scale-up לטיילים של 16 במקום לבקש טיילים שלא קיימים
  ihmL = L.tileLayerRetry('https://israelhiking.osm.org.il/Hebrew/Tiles/{z}/{x}/{y}.png', {
    attribution:'© <a href="https://israelhiking.osm.org.il">Israel Hiking Map</a>',
    maxZoom:19, maxNativeZoom:16, maxRetries:3, retryDelay:600,
    errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
  });
  ihmL.addTo(map);

  satL = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {attribution:'Esri', maxZoom:19});

  map.on('click', onMapClick);
  map.on('mousemove', onMouseMove);
  setMode('pan');

  // pre-fetch שבילים בזמן גלילה — בשקט ברקע
  let prefetchTimer;
  map.on('moveend zoomend', () => {
    clearTimeout(prefetchTimer);
    if (map.getZoom() < 12) return; // רק בזום קרוב מספיק
    prefetchTimer = setTimeout(() => {
      const c = map.getCenter();
      const key = tileKey(c.lat, c.lng);
      if (!geoCache.has(key) && !pendingTiles.has(key)) {
        setStatus('⬇️ טוען שבילים ברקע...');
        fetchTile(c.lat, c.lng)
          .then(els => setStatus(`✓ ${els.length} שבילים נטענו`))
          .catch(() => {});
      }
    }, 800);
  });

  // סגור תוצאות חיפוש בלחיצה על מפה
  map.on('click', () => closeSearch());
}

// ── Mode ─────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  ['pan','free','snap'].forEach(id => {
    const b=document.getElementById('btn-'+id);
    if(b) b.className='bbt';
  });
  const sb = document.getElementById('btn-'+m);
  if(sb) sb.classList.add(m+'-active');
  const sp = document.getElementById('snap-panel');
  clearPreview();
  if (m==='pan')  { map.dragging.enable();  map.getContainer().style.cursor='';           sp.classList.remove('on'); setStatus('גלול, זום וגע'); }
  if (m==='free') { map.dragging.disable(); map.getContainer().style.cursor='crosshair';  sp.classList.remove('on'); setStatus('גע להוסיף נקודות'); }
  if (m==='snap') { map.dragging.disable(); map.getContainer().style.cursor='crosshair';  sp.classList.add('on');    setStatus('גע ליד שביל'); setSnapMsg('גע על המפה'); }
}

// ── Preview line on hover (snap mode) ────────────────────
function onMouseMove(e) {
  if (mode !== 'snap') return;
  if (snapPts.length === 0) return;
  const last = snapPts[snapPts.length-1];
  clearPreview();
  previewLine = L.polyline([last, e.latlng], {
    color:'#4ade80', weight:2, opacity:0.5, dashArray:'6,5', interactive:false
  }).addTo(map);
}
function clearPreview() {
  if (previewLine) { map.removeLayer(previewLine); previewLine=null; }
}

// ── Map click ────────────────────────────────────────────
async function onMapClick(e) {
  if (mode==='pan') return;
  closeSearch();
  if (mode==='free') {
    addFreePoint(e.latlng);
  } else {
    await doSnap(e.latlng);
  }
}

// ── Free drawing ─────────────────────────────────────────
function addFreePoint(ll) {
  // ציור חופשי — polyline פשוט, נקודה אחרי נקודה
  if (!freePolyline) {
    freePolyline = L.polyline([ll], {
      color:'#3b82f6', weight:4, opacity:0.9, lineJoin:'round', lineCap:'round'
    }).addTo(map);
  } else {
    freePolyline.addLatLng(ll);
  }
  undoStack.push({type:'free', ll});
  updateRP();
  setStatus(`${freePolyline.getLatLngs().length} נקודות`);
}

// ── Snap drawing ─────────────────────────────────────────

// מעקב אחר קטעים שכבר עברנו בהם — לזיהוי חפיפה
// key: "lat1,lng1→lat2,lng2" (מעוגל) → מספר פעמים
const segmentCount = new Map();

function segKey(a, b) {
  // מעגל ל-4 ספרות ומייצר key דו-כיווני (A→B == B→A)
  const k1 = `${a.lat.toFixed(4)},${a.lng.toFixed(4)}`;
  const k2 = `${b.lat.toFixed(4)},${b.lng.toFixed(4)}`;
  return k1 < k2 ? `${k1}→${k2}` : `${k2}→${k1}`;
}

function countSegments(latlngs) {
  // מחזיר מפה: כל צמד נקודות → כמה פעמים עבר שם
  const counts = new Map();
  for (let i = 0; i < latlngs.length - 1; i++) {
    const k = segKey(latlngs[i], latlngs[i+1]);
    const existing = segmentCount.get(k) || 0;
    segmentCount.set(k, existing + 1);
    counts.set(k, existing + 1);
  }
  return counts;
}

function removeSegmentCounts(latlngs) {
  for (let i = 0; i < latlngs.length - 1; i++) {
    const k = segKey(latlngs[i], latlngs[i+1]);
    const v = segmentCount.get(k) || 1;
    if (v <= 1) segmentCount.delete(k);
    else segmentCount.set(k, v - 1);
  }
}

// offset geometry — מזיז קו ימינה ב-offsetPx פיקסלים
function offsetLatLngs(latlngs, offsetMeters) {
  const result = [];
  for (let i = 0; i < latlngs.length; i++) {
    const prev = latlngs[Math.max(0, i-1)];
    const next = latlngs[Math.min(latlngs.length-1, i+1)];
    // כיוון הקטע
    const dLat = next.lat - prev.lat;
    const dLng = next.lng - prev.lng;
    const len = Math.sqrt(dLat*dLat + dLng*dLng) || 1;
    // נורמל אנכי (ימינה)
    const nLat = -dLng / len;
    const nLng =  dLat / len;
    // המרה ממטרים למעלות (~111000 מ' למעלה)
    const d = offsetMeters / 111000;
    result.push(L.latLng(latlngs[i].lat + nLat*d, latlngs[i].lng + nLng*d));
  }
  return result;
}

// מוסיף חצי כיוון על קטע — כיוון תמיד מ-latlngs[0] ל-latlngs[N]
function addArrowDecorators(latlngs, color) {
  const arrows = [];
  const ARROW_SPACING = 180; // מטרים בין חצים
  const ARROW_SIZE    =  12; // מטרים — גודל כנפי החץ

  let distAcc    = 0;
  let nextArrowAt = ARROW_SPACING * 0.4; // חץ ראשון מוקדם קצת

  for (let i = 0; i < latlngs.length - 1; i++) {
    const A = latlngs[i], B = latlngs[i+1];
    const segLen = A.distanceTo(B);
    if (segLen < 0.1) continue;

    distAcc += segLen;

    while (distAcc >= nextArrowAt) {
      // מיקום החץ על הקטע (t ∈ [0,1])
      const t = 1 - (distAcc - nextArrowAt) / segLen;

      const lat = A.lat + (B.lat - A.lat) * t;
      const lng = A.lng + (B.lng - A.lng) * t;

      // כיוון אמיתי: A → B (lat מעלה = צפון, lng ימינה = מזרח)
      // ב-Leaflet: lat = Y (צפון), lng = X (מזרח)
      // heading = זווית מצפון בשעון (כמו bearing)
      const dLat = B.lat - A.lat;
      const dLng = (B.lng - A.lng) * Math.cos(lat * Math.PI / 180); // תיקון קוסינוס לרוחב
      const heading = Math.atan2(dLng, dLat); // radians מצפון

      // כנפי החץ — 140° משני צדי הכיוון ההפוך (חץ קדימה)
      const d = ARROW_SIZE / 111000;
      const wingAngle = Math.PI * 0.78;
      const angle1 = heading - wingAngle;
      const angle2 = heading + wingAngle;

      const tip   = L.latLng(lat, lng);
      const wing1 = L.latLng(
        lat + Math.cos(angle1) * d,
        lng + Math.sin(angle1) * d / Math.cos(lat * Math.PI / 180)
      );
      const wing2 = L.latLng(
        lat + Math.cos(angle2) * d,
        lng + Math.sin(angle2) * d / Math.cos(lat * Math.PI / 180)
      );

      const arrow = L.polyline([wing1, tip, wing2], {
        color, weight: 2.5, opacity: 0.85,
        lineCap: 'round', lineJoin: 'round',
        interactive: false
      }).addTo(map);
      arrows.push(arrow);
      nextArrowAt += ARROW_SPACING;
    }
  }
  return arrows;
}

// כל הlayers הנוספים (חצים) — נשמרים ל-undo
let arrowLayers = []; // מערך מקביל ל-snapSegs

async function doSnap(clicked) {
  clearPreview();
  setSnapMsg('🌐 מחפש שבילים...'); setStatus('שולח בקשה ל-OSM...');

  const snapped = await findSnap(clicked);
  const pt = snapped || clicked;

  if (snapPts.length > 0) {
    const from = snapPts[snapPts.length-1];
    setSnapMsg('🗺 מנתב לאורך השביל...');
    const pathNodes = await routeAlong(from, pt);

    let seg;
    if (pathNodes && pathNodes.length > 1) {
      seg = pathNodes;
      setSnapMsg(`✓ ${pathNodes.length} נקודות על שביל`);
      setStatus('נדבק לשביל ✓');
    } else {
      seg = [from, pt];
      setSnapMsg('⚠️ קו ישר — לא נמצא שביל');
      setStatus('קו ישר (fallback)');
    }

    // בדוק חפיפה עם קטעים קיימים
    countSegments(seg);
    const isOverlap = seg.some((_, i) => {
      if (i >= seg.length - 1) return false;
      const k = segKey(seg[i], seg[i+1]);
      return (segmentCount.get(k) || 0) > 1;
    });

    // אם יש חפיפה — הזז צדדית; אחרת צייר על המקום
    const drawSeg = isOverlap ? offsetLatLngs(seg, 6) : seg;
    // ירוק = על שביל, כתום-מקווקו = חפיפה — אין יותר צהוב
    const lineColor = isOverlap ? '#fb923c' : '#4ade80';

    const segLine = L.polyline(drawSeg, {
      color: lineColor,
      weight: isOverlap ? 3 : 4,
      opacity: 0.92,
      lineJoin:'round', lineCap:'round',
      dashArray: isOverlap ? '8,4' : null
    }).addTo(map);

    // חצי כיוון — תמיד לפי כיוון ההליכה (from→pt)
    // במסלול חוזר drawSeg מוזז הצידה אבל הסדר שלו זהה ל-seg (from→pt)
    const arrows = addArrowDecorators(drawSeg, lineColor);
    arrowLayers.push(arrows);

    snapSegs.push(segLine);
    snapPts.push(pt);
    undoStack.push({type:'snap', seg:segLine, pt, rawSeg:seg, arrows});

  } else {
    snapPts.push(pt);
    undoStack.push({type:'snap-first', pt});
    arrowLayers.push([]);
    setSnapMsg('✓ נקודת התחלה • גע לנקודה הבאה');
    setStatus('נקודת התחלה נקבעה');
  }

  addAnchorDot(pt, '#4ade80');
  updateRP();
}

// נקודות עוגן (circles על המפה)
let anchorMarkers = [];
function addAnchorDot(ll, color) {
  const m = L.circleMarker(ll, {
    radius:5, fillColor:color, color:'#0f172a', weight:2, fillOpacity:1, interactive:false
  }).addTo(map);
  anchorMarkers.push(m);
}

async function findSnap(ll) {
  const cached = geoCache.has(tileKey(ll.lat, ll.lng));
  setSnapMsg(cached ? '⚡ מה-cache...' : '🌐 טוען אזור...');
  try {
    const els = await getTrailsNear(ll);
    if (!els.length) { setSnapMsg('⚠️ אזור ריק ב-OSM'); return null; }
    let bp=null, bd=Infinity;
    for (const el of els) {
      if (!el.geometry||el.geometry.length<2) continue;
      for (let i=0;i<el.geometry.length-1;i++) {
        const a={lat:el.geometry[i].lat,lng:el.geometry[i].lon};
        const b={lat:el.geometry[i+1].lat,lng:el.geometry[i+1].lon};
        const cp=closestSeg(ll,a,b), dd=hvDist(ll,cp);
        if(dd<bd){bd=dd;bp=cp;}
      }
    }
    if (bp&&bd<1500) { setSnapMsg(`✓ ${Math.round(bd)}מ' ${cached?'⚡':'🌐'}`); return L.latLng(bp.lat,bp.lng); }
    setSnapMsg(`⚠️ הקרוב: ${Math.round(bd)}מ'`);
  } catch(e) { setSnapMsg(`❌ ${e.message}`); console.error(e); }
  return null;
}

async function routeAlong(from, to) {
  try {
    // מאחד tiles בין שתי הנקודות
    const midLat=(from.lat+to.lat)/2, midLng=(from.lng+to.lng)/2;
    const allTileKeys = new Set([
      tileKey(from.lat,from.lng),
      tileKey(to.lat,to.lng),
      tileKey(midLat,midLng),
    ]);
    const allEls = [];
    const seen = new Set();
    for (const key of allTileKeys) {
      const [tLat,tLng] = key.split('_').map(Number);
      const els = await fetchTile(tLat*TILE_SIZE+TILE_SIZE/2, tLng*TILE_SIZE+TILE_SIZE/2);
      for (const el of els) {
        if (!seen.has(el.id)) { seen.add(el.id); allEls.push(el); }
      }
    }

    let bw=null, bs=Infinity;
    for (const el of allEls) {
      if (!el.geometry||el.geometry.length<2) continue;
      const sc=minD(from,el.geometry)+minD(to,el.geometry);
      if(sc<bs){bs=sc;bw=el;}
    }
    if (bw&&bs<0.05) {
      const nodes=bw.geometry.map(nn=>L.latLng(nn.lat,nn.lon));
      const i1=nearIdx(from,nodes),i2=nearIdx(to,nodes);
      const s2=Math.min(i1,i2),e2=Math.max(i1,i2);
      if(e2-s2>0) {
        const path = nodes.slice(s2, e2+1);
        // אם הכיוון הגיאוגרפי הוא מi1 לi2, ו-i1>i2, סדר הנקודות הפוך
        // → הפוך כדי שהחצים יצביעו מ-from ל-to
        return i1 <= i2 ? path : path.reverse();
      }
    }
  } catch(e) { console.error(e); }
  return null;
}

// ── Search (Nominatim) ────────────────────────────────────
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchTimeout;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  const v = searchInput.value.trim();
  if (v.length < 2) { closeSearch(); return; }
  searchTimeout = setTimeout(() => runSearch(v), 400);
});
searchInput.addEventListener('keydown', e => {
  if (e.key==='Enter') { clearTimeout(searchTimeout); runSearch(searchInput.value.trim()); }
  if (e.key==='Escape') closeSearch();
});

async function doSearch() {
  const v = searchInput.value.trim();
  if (v) runSearch(v);
}

async function runSearch(q) {
  if (!q) return;
  setStatus('מחפש...');
  try {
    // Nominatim — חיפוש geocoding חינמי
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&countrycodes=il&accept-language=he`;
    const res = await fetch(url, {headers:{'Accept-Language':'he'}});
    const data = await res.json();

    searchResults.innerHTML = '';
    if (!data.length) {
      searchResults.innerHTML = '<div class="sr-item"><span style="color:#64748b">לא נמצאו תוצאות</span></div>';
    } else {
      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'sr-item';
        // קצר את השם הארוך
        const name = item.display_name.split(',').slice(0,2).join(', ');
        const type = item.type || item.class || '';
        div.innerHTML = `
          <span class="sr-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
          </span>
          <div><div class="sr-name">${name}</div><div class="sr-sub">${type}</div></div>`;
        div.onclick = () => goToResult(item);
        searchResults.appendChild(div);
      });
    }
    searchResults.style.display = 'block';
    setStatus('בחר תוצאה');
  } catch(e) {
    setStatus('❌ שגיאת חיפוש');
    console.error(e);
  }
}

function goToResult(item) {
  const lat = parseFloat(item.lat), lng = parseFloat(item.lon);
  closeSearch();
  searchInput.value = item.display_name.split(',')[0];

  // הסר סיכה קודמת
  if (searchMarker) { map.removeLayer(searchMarker); searchMarker=null; }

  // סיכה מותאמת
  const icon = L.divIcon({
    html: `<svg viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg" width="28" height="37">
      <path d="M12 0C7.58 0 4 3.58 4 8c0 5.08 8 18 8 18s8-12.92 8-18c0-4.42-3.58-8-8-8z" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
      <circle cx="12" cy="8" r="3" fill="white"/>
    </svg>`,
    className:'', iconSize:[28,37], iconAnchor:[14,37], popupAnchor:[0,-37]
  });

  searchMarker = L.marker([lat,lng], {icon})
    .addTo(map)
    .bindPopup(`<b>${item.display_name.split(',')[0]}</b>`, {closeButton:true})
    .openPopup();

  // zoom חכם לפי bbox אם יש
  if (item.boundingbox) {
    const bb = item.boundingbox.map(parseFloat);
    map.fitBounds([[bb[0],bb[2]],[bb[1],bb[3]]], {maxZoom:16, padding:[40,40]});
  } else {
    map.setView([lat,lng], 14);
  }
  setStatus(`📍 ${item.display_name.split(',')[0]}`);
}

function closeSearch() {
  searchResults.style.display = 'none';
}

// ── GPS ──────────────────────────────────────────────────
function toggleGPS() {
  const btn=document.getElementById('gps-btn');
  if (gpsOn) {
    if(watchId) navigator.geolocation.clearWatch(watchId);
    gpsOn=false; btn.classList.remove('on');
    if(gpsMarker){map.removeLayer(gpsMarker);map.removeLayer(gpsCircle);gpsMarker=null;}
    setStatus('GPS כבוי'); return;
  }
  if (!navigator.geolocation) { alert('GPS לא זמין'); return; }
  gpsOn=true; btn.classList.add('on'); setStatus('מאתר מיקום...');
  watchId=navigator.geolocation.watchPosition(pos=>{
    const ll=L.latLng(pos.coords.latitude,pos.coords.longitude), ac=pos.coords.accuracy;
    if(!gpsMarker) {
      gpsCircle=L.circle(ll,{radius:ac,color:'#34d399',fillColor:'#34d399',fillOpacity:0.1,weight:1}).addTo(map);
      gpsMarker=L.circleMarker(ll,{radius:8,fillColor:'#34d399',color:'#fff',weight:2,fillOpacity:1}).addTo(map);
      map.setView(ll,15);
    } else { gpsMarker.setLatLng(ll); gpsCircle.setLatLng(ll).setRadius(ac); }
    setStatus(`📍 דיוק: ${Math.round(ac)}מ'`);
  }, err=>{
    setStatus('❌ GPS: '+err.message); gpsOn=false; btn.classList.remove('on');
  },{enableHighAccuracy:true,maximumAge:5000});
}

// ── Layers ───────────────────────────────────────────────
function toggleLayer(name) {
  const m={ihm:ihmL, sat:satL};
  const lyr=m[name], chk=document.getElementById('c-'+name);
  if(map.hasLayer(lyr)){map.removeLayer(lyr);chk.checked=false;}
  else{lyr.addTo(map);chk.checked=true;}
}

// ── Route info ───────────────────────────────────────────
function updateRP() {
  let total=0;
  // חשב מ-snap segments
  for (const seg of snapSegs) {
    const lls=seg.getLatLngs();
    for(let i=1;i<lls.length;i++) total+=lls[i-1].distanceTo(lls[i]);
  }
  // חשב מ-free polyline
  if (freePolyline) {
    const lls=freePolyline.getLatLngs();
    for(let i=1;i<lls.length;i++) total+=lls[i-1].distanceTo(lls[i]);
  }
  if (total>0) {
    document.getElementById('rdist').textContent=(total/1000).toFixed(2);
    document.getElementById('rpts').textContent=`ק"מ • ${snapPts.length||freePolyline?.getLatLngs().length||0} נקודות`;
    document.getElementById('route-panel').style.display='block';
  }
}

// ── Undo ─────────────────────────────────────────────────
function undoLast() {
  if (!undoStack.length) return;
  const op = undoStack.pop();

  if (op.type==='free') {
    if (freePolyline) {
      const lls = freePolyline.getLatLngs();
      lls.pop();
      if (lls.length===0) { map.removeLayer(freePolyline); freePolyline=null; }
      else freePolyline.setLatLngs(lls);
    }
  } else if (op.type==='snap') {
    map.removeLayer(op.seg);
    snapSegs.pop();
    snapPts.pop();
    // נקה חצים
    if (op.arrows) op.arrows.forEach(a => map.removeLayer(a));
    arrowLayers.pop();
    // נקה segment counts
    if (op.rawSeg) removeSegmentCounts(op.rawSeg);
    const am=anchorMarkers.pop(); if(am) map.removeLayer(am);
  } else if (op.type==='snap-first') {
    snapPts.pop();
    arrowLayers.pop();
    const am=anchorMarkers.pop(); if(am) map.removeLayer(am);
  }

  updateRP();
  if(!snapPts.length && !snapSegs.length && !freePolyline)
    document.getElementById('route-panel').style.display='none';
  setStatus('בוטל');
}

// ── Clear ────────────────────────────────────────────────
function clearRoute() {
  snapPts=[]; undoStack=[];
  snapSegs.forEach(s=>map.removeLayer(s)); snapSegs=[];
  anchorMarkers.forEach(m=>map.removeLayer(m)); anchorMarkers=[];
  arrowLayers.forEach(arr=>arr.forEach(a=>map.removeLayer(a))); arrowLayers=[];
  segmentCount.clear();
  if(freePolyline){map.removeLayer(freePolyline);freePolyline=null;}
  clearPreview();
  document.getElementById('route-panel').style.display='none';
  setStatus('נוקה');
}

// ── GPX export ───────────────────────────────────────────
function exportGPX() {
  // איסוף כל הנקודות לפי סדר
  let allPts = [];
  if (freePolyline) allPts = freePolyline.getLatLngs();
  else {
    for(const seg of snapSegs) {
      const lls=seg.getLatLngs();
      if(!allPts.length) allPts.push(lls[0]);
      allPts.push(...lls.slice(1));
    }
  }
  if(allPts.length<2){alert('אין נקודות');return;}
  let g=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="שבילי ישראל" xmlns="http://www.topografix.com/GPX/1/1">\n  <trk><name>מסלול</name><trkseg>\n`;
  for(const p of allPts) g+=`    <trkpt lat="${p.lat.toFixed(7)}" lon="${p.lng.toFixed(7)}"></trkpt>\n`;
  g+=`  </trkseg></trk>\n</gpx>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([g],{type:'application/gpx+xml'}));
  a.download='מסלול.gpx'; a.click();
}

// ── Geometry ─────────────────────────────────────────────
function closestSeg(p,a,b){
  const dx=b.lng-a.lng,dy=b.lat-a.lat,l2=dx*dx+dy*dy;
  if(!l2) return a;
  let t=((p.lng-a.lng)*dx+(p.lat-a.lat)*dy)/l2;
  t=Math.max(0,Math.min(1,t));
  return{lat:a.lat+t*dy,lng:a.lng+t*dx};
}
function hvDist(a,b){
  const R=6371000,dLa=(b.lat-a.lat)*Math.PI/180,dLn=(b.lng-a.lng)*Math.PI/180;
  const s=Math.sin(dLa/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLn/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function minD(pt,g){let m=Infinity;for(const n of g){const d=(pt.lat-n.lat)**2+(pt.lng-n.lon)**2;if(d<m)m=d;}return Math.sqrt(m);}
function nearIdx(pt,ns){let b=0,bd=Infinity;ns.forEach((n,i)=>{const d=(pt.lat-n.lat)**2+(pt.lng-n.lng)**2;if(d<bd){bd=d;b=i;}});return b;}
function setStatus(m){document.getElementById('statusbar').textContent=m;}
function setSnapMsg(m){document.getElementById('snap-msg').textContent=m;}

initMap();
</script>
